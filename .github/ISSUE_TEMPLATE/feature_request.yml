name: Feature request
description: Suggest an operation, workflow, or UI improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not just the feature. What are you doing today, and where does it hurt?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Workbench to do?
    validations:
      required: true
  - type: input
    id: operation
    attributes:
      label: Suggested operation id
      description: If this is an operation, what should it be called?
      placeholder: image.watermark
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools, scripts, or workarounds.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the README for this.
          required: true
